[project]
name = "sd-webui-agent-relay"
version = "0.1.0"
description = "Tailscale-only relay in front of Stable Diffusion WebUI Forge Neo."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
